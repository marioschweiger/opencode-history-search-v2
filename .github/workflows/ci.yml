name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Single OS: the code is platform-neutral TypeScript (bun + node:sqlite).
    # Linux is the strictest case (case-sensitive filesystem) and has the
    # most reliable hosted runner pool.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bunx tsc --noEmit

      - name: Test
        run: bun test
